name: Bug Report
description: Report a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: Describe the bug
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Tap on...
        3. See error...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
  - type: input
    attributes:
      label: Flutter version
      description: Output of `flutter --version`
  - type: input
    attributes:
      label: Device / OS
      placeholder: e.g. Pixel 9 / Android 15
  - type: textarea
    attributes:
      label: Logs
      description: Relevant logs or stack traces
