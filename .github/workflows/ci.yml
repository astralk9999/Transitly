name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Alineado con pubspec `sdk: ^3.9.2`. Flutter 3.35.x trae Dart 3.9;
  # 3.32.x traía Dart 3.8 → fallaba la resolución del constraint.
  FLUTTER_VERSION: "3.35.x"
  # SEC2: .env ya no se bundlea. Las variables se pasan vía --dart-define.
  # Para builds reales, configurar estos secrets en GitHub y pasar los
  # --dart-define correspondientes. Los tests no dependen de Env.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-key' }}

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze

  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter test (with coverage)
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep lines | awk '{print $2}' | sed 's/%//')
          THRESHOLD=24
          echo "Coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Coverage gate by module
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          # data/operator/ ≥60%
          OPERATOR_COV=$(lcov --summary coverage/lcov.info 2>&1 | grep -oP 'lines\.*:\s*\K[\d.]+' | head -1 || echo "0")
          echo "data/operator coverage: ${OPERATOR_COV}% (gate: 60%)"
          # core/ ≥70%
          echo "core/ coverage gate: 70% (informational — enforced after PRO-QA-09 complete)"
          # Report module-level coverage for Codecov
          echo "## Coverage by module" >> $GITHUB_STEP_SUMMARY
          lcov --list coverage/lcov.info 2>&1 | grep -E "lib/(data|core|features|shared)" | head -20 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build Web (release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # Valida que la app compila en release. Las credenciales reales se
      # pasan vía --dart-define; para el CI usamos placeholders (el build
      # no ejecuta código, solo compila).
      - name: Flutter build web (release)
        run: flutter build web --release --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # Valida que la app compila para Android. Sin key.properties se
      # firma con debug keys (válido para CI, no para Play Store).
      # --obfuscate y --split-debug-info aplican ofuscación Dart y
      # archivan los symbol files para desofuscar crash reports.
      # --split-per-abi reduce el tamaño del APK para distribución.
      - name: Flutter build APK (release)
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/debug-info \
            --analyze-size \
            --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }} \
            --build-number=${{ github.run_number }}

      - name: APK size budget
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          BUDGET_MB=80
          echo "## APK Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | Size (MB) | Budget (MB) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|----------:|------------:|--------|" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for apk in "$APK_DIR"/*-release.apk; do
            if [ -f "$apk" ]; then
              ABI=$(basename "$apk" .apk | sed 's/app-//' | sed 's/-release//')
              SIZE_BYTES=$(stat -c%s "$apk")
              SIZE_MB=$((SIZE_BYTES / 1048576))
              if [ "$SIZE_MB" -gt "$BUDGET_MB" ]; then
                echo "| $ABI | $SIZE_MB | $BUDGET_MB | :red_circle: FAIL |" >> $GITHUB_STEP_SUMMARY
                echo "::error::$ABI APK size ${SIZE_MB} MB exceeds ${BUDGET_MB} MB budget"
                FAILED=1
              else
                echo "| $ABI | $SIZE_MB | $BUDGET_MB | :green_circle: PASS |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Budget source: docs/PERFORMANCE_BUDGET.md" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" -eq 1 ]; then
            echo "One or more APKs exceeded the ${BUDGET_MB} MB budget"
            exit 1
          fi
          echo "All APKs within ${BUDGET_MB} MB budget"

      - name: Upload debug info (obfuscation symbols)
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info/
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Flutter build AAB (release)
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs \
            build/app/outputs/bundle/release/app-release.aab 2>&1 | head -5


  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules.yaml
