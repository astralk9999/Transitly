# Semgrep Rules for Transitly

rules:
  - id: no-hardcoded-es-strings
    pattern-regex: "['\"][A-ZÁÉÍÓÚÜÑ][^'\"]*[áéíóúüñ][^'\"]*['\"]"
    message: |
      Spanish string literal found. Use l10n via AppLocalizations instead.
      Exception: env_error_screen.dart (diagnostic-only, no l10n delegates).
      NOTE: severity downgraded to INFO. Migración total a i18n queda como
      sub-plan futuro; mientras tanto la regla solo informa.
    paths:
      include:
        - "lib/**/*.dart"
      exclude:
        - "lib/l10n/**"
        - "lib/features/error/env_error_screen.dart"
        - "lib/core/env.dart"
    languages:
      - generic
    severity: INFO

  - id: no-print-in-lib
    pattern: print(
    message: "print() is forbidden in lib/. Use AppLogger instead."
    paths:
      include:
        - "lib/**/*.dart"
      exclude:
        # main.dart usa print() intencionalmente en el bloque pre-AppLogger:
        # los fallos de arranque críticos (Env, Supabase init) necesitan
        # visibilidad antes de que AppLogger esté disponible. Justificación
        # documentada con // ignore: avoid_print en cada caso.
        - "lib/main.dart"
        # hive_init.dart usa print() en el catch del open box porque el
        # AppLogger filtra por kDebugMode y queremos diagnóstico en release.
        - "lib/data/cache/hive_init.dart"
    languages:
      - generic
    severity: ERROR

  - id: no-hardcoded-supabase-url
    pattern-regex: "https://[a-z]+\\.supabase\\.co"
    message: "Hardcoded Supabase URL detected. Use Env.supabaseUrl or --dart-define."
    paths:
      include:
        - "lib/**/*.dart"
    languages:
      - generic
    severity: ERROR
