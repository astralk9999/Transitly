pre-commit:
  parallel: true
  commands:
    analyze:
      run: flutter analyze
      glob: "*.dart"
    format:
      run: dart format --set-exit-if-changed {staged_files}
      glob: "*.dart"
      exclude: "*.freezed.dart|*.g.dart|l10n/generated/"

commit-msg:
  commands:
    conventional-commits:
      run: |
        if ! grep -qE "^(feat|fix|refactor|docs|test|chore|style|perf|ci|build|revert)(\(.+\))?[!]?: " "$1"; then
          echo "Commit message must follow Conventional Commits"
          exit 1
        fi

pre-push:
  commands:
    verify-state:
      run: |
        tool/verify_state.sh > /tmp/estado_actual.md
        diff <(sed -n '/<!-- BEGIN ESTADO -->/,/<!-- END ESTADO -->/p' docs/00_MAESTRO.md) /tmp/estado_actual.md || {
          echo "ERROR: docs/00_MAESTRO.md estado block is stale."
          echo "Run: tool/verify_state.sh and update the estado block."
          exit 1
        }
    test:
      run: flutter test
    analyze:
      run: flutter analyze
