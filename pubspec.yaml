name: transitly
description: "Next-generation urban transit companion for Jerez de la Frontera"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Fonts
  google_fonts: ^6.2.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Icons
  lucide_icons: ^0.257.0

  # UI
  shimmer: ^3.0.0

  # NFC
  nfc_manager: ^3.5.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4

  # Codegen — value-class models con igualdad por valor + copyWith.
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Backend (F2). supabase_flutter ya incluye postgrest, gotrue,
  # realtime_client y storage_client como deps transitivas.
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.1.0

  # Caché local + cola offline (F3). hive_flutter solo añade
  # path_provider integration sobre hive 2.x.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4

  # Geo (F8) — geolocator para posición del usuario,
  # permission_handler para pedir permisos en runtime.
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  flex_color_picker: ^3.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Codegen runner + freezed/json_serializable generadores.
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/mock/
    - assets/branding/
    # TODO F26: Bundle google_fonts dmSans + ibmPlexMono as local assets
    # Steps:
    # 1. Download from https://fonts.google.com/specimen/DM+Sans and IBM+Plex+Mono
    # 2. Copy .ttf files to assets/fonts/dm_sans/ and assets/fonts/ibm_plex_mono/
    # 3. Add here: - assets/fonts/
    # 4. In main.dart, call GoogleFonts.config.allowRuntimeFetching = false;
    # 5. Register font files with GoogleFonts.registerFontFamily(...)
    # Meanwhile, google_fonts falls back to network fetch.
    # flutter_dotenv carga el .env local como un asset bundleado en
    # debug. En release, sustituir por --dart-define o un .env por
    # plataforma (F22 lo formaliza).
    - .env

  shaders:
    - shaders/smoke.frag
