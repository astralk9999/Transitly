name: transitly
description: "Demo academica (TFG) de companion de transporte publico. Datos mock de COMUJESA (Jerez) con capa Supabase opcional (auth, repos, push, telemetria). Tracking estimado + GPS de conductor (GTFS-Realtime es trabajo futuro), comunidad (incidencias, sugerencias, votos), offline-first, accesibilidad WCAG 2.1 AA parcial, panel de administracion y moderacion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flex_color_picker: ^3.7.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_map_tile_caching: ^10.0.0
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^10.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.0
  go_router: 17.2.3
  google_fonts: 6.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  home_widget: ^0.7.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  lucide_icons: ^0.257.0
  nfc_manager: ^3.5.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  posthog_flutter: ^5.24.2
  riverpod: 2.6.1
  sentry_flutter: 8.14.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4
  shimmer: ^3.0.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  # workmanager eliminado: declarado pero nunca cableado en Dart, y la
  # 0.5.2 usa la API v1-embedding (ShimPluginRegistry/Registrar) removida
  # en Flutter 3.x → rompía `flutter build apk --release`. El refresco
  # periódico del widget (docs/HOME_WIDGETS.md) queda como trabajo futuro.

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/mock/
    - assets/branding/
    - assets/achievements.json
    # F26 cerrado: fuentes locales incluidas.

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Bold.ttf
          weight: 700

  shaders:
    - shaders/smoke.frag
