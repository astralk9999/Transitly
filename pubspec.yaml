name: transitly
description: "Demo academica (TFG) de companion de transporte publico. Datos mock de COMUJESA (Jerez) con capa Supabase opcional (auth, repos, push, telemetria). Tracking estimado + GPS de conductor (GTFS-Realtime es trabajo futuro), comunidad (incidencias, sugerencias, votos), offline-first, accesibilidad WCAG 2.1 AA parcial, panel de administracion y moderacion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: 2.6.1

  # Navigation
  go_router: 17.2.3

  # Fonts
  google_fonts: 6.3.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Icons
  lucide_icons: ^0.257.0

  # UI
  shimmer: ^3.0.0

  # NFC
  nfc_manager: ^3.5.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4

  # Codegen — value-class models con igualdad por valor + copyWith.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Backend (F2). supabase_flutter ya incluye postgrest, gotrue,
  # realtime_client y storage_client como deps transitivas.
  supabase_flutter: ^2.8.0

  # Caché local + cola offline (F3). hive_flutter solo añade
  # path_provider integration sobre hive 2.x.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4

  # Geo (F8) — geolocator para posición del usuario,
  # permission_handler para pedir permisos en runtime.
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  flex_color_picker: ^3.7.2
  flutter_map_tile_caching: ^10.0.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^20.1.0
  sentry_flutter: 8.14.2
  posthog_flutter: ^5.24.2
  home_widget: ^0.7.0
  riverpod: 2.6.1
  # workmanager eliminado: declarado pero nunca cableado en Dart, y la
  # 0.5.2 usa la API v1-embedding (ShimPluginRegistry/Registrar) removida
  # en Flutter 3.x → rompía `flutter build apk --release`. El refresco
  # periódico del widget (docs/HOME_WIDGETS.md) queda como trabajo futuro.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Codegen runner + freezed/json_serializable generadores.
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/mock/
    - assets/branding/
    - assets/achievements.json
    # F26 cerrado: fuentes locales incluidas.

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Bold.ttf
          weight: 700

  shaders:
    - shaders/smoke.frag
