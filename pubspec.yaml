name: transitly
description: "Demo academica (TFG) de companion de transporte publico. Datos mock de COMUJESA (Jerez) con capa Supabase opcional (auth, repos, push, telemetria). Tracking estimado + GPS de conductor (GTFS-Realtime es trabajo futuro), comunidad (incidencias, sugerencias, votos), offline-first, accesibilidad WCAG 2.1 AA parcial, panel de administracion y moderacion."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.9.2

dependencies:
  connectivity_plus: ^6.1.4
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_map_tile_caching: ^10.1.1
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.0
  go_router: 17.3.0
  google_fonts: 6.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  home_widget: ^0.9.2
  image_picker: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  lucide_icons: ^0.257.0
  nfc_manager: ^3.5.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  posthog_flutter: ^5.25.2
  riverpod: 2.6.1
  sentry_flutter: 8.14.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4
  shimmer: ^3.0.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  http: ^1.6.0
  # workmanager eliminado: declarado pero nunca cableado en Dart, y la
  # 0.5.2 usa la API v1-embedding (ShimPluginRegistry/Registrar) removida
  # en Flutter 3.x → rompía `flutter build apk --release`. El refresco
  # periódico del widget (docs/HOME_WIDGETS.md) queda como trabajo futuro.

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/transitly_logo_white_padded.png"
  adaptive_icon_background: "#08081A"
  adaptive_icon_foreground: "assets/branding/transitly_logo_white_padded.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#08081A"
  image: assets/branding/transitly_logo_white_padded.png
  android_12:
    icon_background_color: "#08081A"
    image: assets/branding/transitly_logo_white_padded.png
  fullscreen: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/mock/
    - assets/branding/
    - assets/achievements.json
    # F26 cerrado: fuentes locales incluidas.

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Bold.ttf
          weight: 700
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700

  shaders:
    - shaders/smoke.frag
